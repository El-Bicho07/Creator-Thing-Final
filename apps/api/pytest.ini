[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

# Fixture loop scope must be session-wide. Note: pytest-asyncio 0.24 does NOT
# support `asyncio_default_test_loop_scope` (it warns "Unknown config option"),
# so the test loop itself is pinned by the session-scoped `event_loop` fixture in
# tests/conftest.py. Without a single loop, every test runs in a fresh loop and
# asyncpg connections end up attached to the wrong one.
asyncio_default_fixture_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning