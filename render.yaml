services:
  - type: web
    name: creator-platform-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard # Minimum 2GB RAM required for E5 embeddings & PyTorch
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8000
      - key: EMBEDDING_DEVICE
        value: cpu
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
